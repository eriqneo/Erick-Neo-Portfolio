<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span ref="{{ ref }}" style="position:relative;display:inline-flex;overflow:hidden;vertical-align:top;line-height:1.2"><sc-for list="{{ letters }}" as="l" hint-placeholder-count="6"><span style="position:relative;display:inline-block;white-space:pre;transition:transform .6s cubic-bezier(.65,0,.35,1);transition-delay:{{ l.d }};transform:{{ l.t }}">{{ l.c }}<span aria-hidden="true" style="position:absolute;left:0;top:100%">{{ l.c }}</span></span></sc-for></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:40},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Services&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { h: false };
  ref = React.createRef();
  componentDidMount() {
    const el = this.ref.current; if (!el) return;
    this.host = el.closest('a,button') || el;
    this.on = () => this.setState({ h: true }); this.off = () => this.setState({ h: false });
    this.host.addEventListener('mouseenter', this.on); this.host.addEventListener('mouseleave', this.off);
  }
  componentWillUnmount() {
    if (!this.host) return;
    this.host.removeEventListener('mouseenter', this.on); this.host.removeEventListener('mouseleave', this.off);
  }
  renderVals() {
    const t = String(this.props.text ?? ''), h = this.state.h;
    return { ref: this.ref, letters: [...t].map((c, i) => ({ c: c === ' ' ? '\u00a0' : c, d: (i * 0.018).toFixed(3) + 's', t: h ? 'translateY(-100%)' : 'translateY(0)' })) };
  }
}
</script>
</body>
</html>
